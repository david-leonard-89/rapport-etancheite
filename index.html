<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rapport Expert</title>
    <style>
        :root { --p-width: 210mm; --p-height: 297mm; }
        body { background: #333; margin: 0; padding-top: 60px; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; }
        
        /* BARRE D'OUTILS */
        .toolbar { position: fixed; top: 0; width: 100%; background: #1a1a1a; padding: 10px; display: flex; justify-content: center; gap: 10px; z-index: 2000; }
        .toolbar button { padding: 8px 15px; border-radius: 4px; border: none; cursor: pointer; background: #eee; font-weight: bold; }

        #paper { 
            width: var(--p-width); min-height: var(--p-height); 
            background: white; padding: 15mm; box-sizing: border-box; 
            box-shadow: 0 0 20px rgba(0,0,0,0.5); margin-bottom: 50px;
        }

        .block { position: relative; margin-bottom: 5px; group; }
        
        /* ÉDITION */
        .edit-zone { display: flex; gap: 5px; background: #f4f4f4; padding: 10px; border-radius: 5px; align-items: center; }
        textarea { flex-grow: 1; border: 1px solid #ccc; padding: 8px; border-radius: 4px; font-family: inherit; }
        .btn-valid { background: #27ae60; color: white; border: none; padding: 10px; border-radius: 4px; cursor: pointer; font-weight: bold; }

        /* RÉGLAGE TAILLE (Invisible à l'impression) */
        .size-controls { 
            position: absolute; right: -80px; top: 0; 
            display: flex; flex-direction: column; gap: 2px; 
        }
        .size-controls button { width: 30px; height: 30px; cursor: pointer; background: #444; color: white; border: none; border-radius: 3px; }
        .del-block { color: #ff4d4d; font-size: 10px; cursor: pointer; text-align: center; margin-top: 5px; }

        /* STYLES TEXTE */
        h1 { margin: 0; font-size: 24pt; text-transform: uppercase; border-bottom: 2px solid black; line-height: 1.2; }
        h2 { margin: 0; font-size: 18pt; line-height: 1.2; } /* Pas de uppercase ici */
        p { margin: 0; font-size: 11pt; white-space: pre-wrap; line-height: 1.4; }

        @media print {
            @page { size: A4; margin: 0; }
            body { background: white; padding: 0; }
            .toolbar, .size-controls, .edit-zone, .del-block { display: none !important; }
            #paper { box-shadow: none; margin: 0; width: 100%; padding: 15mm; }
        }

        /* ZOOM MOBILE */
        @media screen and (max-width: 210mm) {
            #paper { transform: scale(calc(100vw / 225mm)); transform-origin: top center; }
        }
    </style>
</head>
<body>

<div class="toolbar">
    <button onclick="addBlock('h1')">H1</button>
    <button onclick="addBlock('h2')">H2</button>
    <button onclick="addBlock('p')">PARAGRAPHE</button>
    <button style="background:#27ae60; color:white" onclick="window.print()">PDF</button>
</div>

<div id="paper"></div>

<script>
    function addBlock(type) {
        const paper = document.getElementById('paper');
        const div = document.createElement('div');
        div.className = 'block';
        div.dataset.type = type;

        div.innerHTML = `
            <div class="edit-zone">
                <textarea placeholder="Saisir ${type}..." onkeydown="handleKey(event, this)"></textarea>
                <button class="btn-valid" onclick="validate(this)">OK</button>
            </div>
            <div class="view-zone" style="display:none;" onclick="reEdit(this)"></div>
            <div class="size-controls" style="display:none;">
                <button onclick="changeSize(this, 1)">+</button>
                <button onclick="changeSize(this, -1)">-</button>
                <span class="del-block" onclick="this.closest('.block').remove()">Suppr.</span>
            </div>
        `;
        paper.appendChild(div);
    }

    function handleKey(e, el) {
        const type = el.closest('.block').dataset.type;
        // Si c'est H1 ou H2, Entrée valide
        if ((type === 'h1' || type === 'h2') && e.key === 'Enter') {
            e.preventDefault();
            validate(el.nextElementSibling);
        }
    }

    function validate(btn) {
        const block = btn.closest('.block');
        const txt = block.querySelector('textarea').value;
        const view = block.querySelector('.view-zone');
        const type = block.dataset.type;
        
        const tag = (type === 'h1') ? 'h1' : (type === 'h2') ? 'h2' : 'p';
        view.innerHTML = `<${tag}>${txt}</${tag}>`;
        
        block.querySelector('.edit-zone').style.display = 'none';
        view.style.display = 'block';
        block.querySelector('.size-controls').style.display = 'flex';
    }

    function reEdit(view) {
        const block = view.closest('.block');
        view.style.display = 'none';
        block.querySelector('.edit-zone').style.display = 'flex';
        block.querySelector('.size-controls').style.display = 'none';
    }

    function changeSize(btn, delta) {
        const view = btn.closest('.block').querySelector('.view-zone').firstElementChild;
        // On récupère la taille actuelle
        const currentSize = window.getComputedStyle(view).fontSize;
        const newSize = parseFloat(currentSize) + delta;
        view.style.fontSize = newSize + 'pt';
    }
</script>
</body>
</html>

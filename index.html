<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rapport Expert - Mobile Fix</title>
    <style>
        :root { --p-width: 210mm; --p-height: 297mm; --blue: #3498db; --dark: #2c3e50; }
        
        /* Fond sombre pour faire ressortir la feuille */
        body { 
            background: #333; 
            margin: 0; 
            padding-top: 70px; 
            font-family: sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center;
            min-height: 100vh;
        }

        /* BARRE DE CRÉATION */
        .toolbar { position: fixed; top: 0; width: 100%; background: #000; padding: 10px; display: flex; justify-content: center; gap: 8px; z-index: 2000; }
        .toolbar button { flex: 1; max-width: 80px; height: 45px; border-radius: 8px; border: none; font-weight: bold; font-size: 12px; cursor: pointer; }

        /* CONTENEUR DE LA FEUILLE (Gestion du Zoom) */
        #viewport {
            width: 100%;
            display: flex;
            justify-content: center;
            overflow-x: hidden;
            padding-bottom: 300px; /* Espace pour la barre de réglage */
        }

        #paper-container { 
            width: var(--p-width); 
            background: white; 
            position: relative; 
            min-height: var(--p-height); 
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            transform-origin: top center;
        }

        #paper { width: 100%; padding: 15mm; box-sizing: border-box; display: flex; flex-direction: column; }

        /* LIGNES DE LIMITE A4 */
        .page-break-line { 
            position: absolute; 
            left: 0; 
            width: 100%; 
            height: 0;
            border-top: 3px dashed #ff4757; 
            pointer-events: none; 
            z-index: 1000;
        }
        .page-break-line::after { 
            content: "LIMITE PAGE A4"; 
            position: absolute; 
            right: 10px; 
            top: -12px;
            background: #ff4757; 
            color: white; 
            font-size: 10px; 
            padding: 2px 8px; 
            border-radius: 4px;
            font-weight: bold;
        }

        /* BLOCS */
        .block { position: relative; margin-bottom: 10px; border: 2px solid transparent; width: 100%; box-sizing: border-box; }
        .block.active { border: 2px solid var(--blue); background: #f0f8ff; }
        
        /* GRILLE PHOTO */
        .img-grid { display: grid; gap: 8px; width: 100%; }
        .img-grid div { width: 100%; background: #eee; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .img-grid img { width: 100%; height: 100%; object-fit: cover; }

        /* TOOLBAR BAS (Inchangée selon tes souhaits) */
        .controls-panel { 
            display: none; position: fixed; bottom: 0; left: 0; width: 100%;
            background: var(--dark); border-top: 4px solid var(--blue);
            z-index: 3000; padding: 15px 10px; box-sizing: border-box;
            flex-direction: column; gap: 12px;
        }
        .active-block-exists .controls-panel { display: flex; }
        .control-row { display: flex; width: 100%; gap: 10px; align-items: center; }
        .btn-group { display: flex; flex: 1; align-items: center; background: #34495e; border-radius: 12px; overflow: hidden; }
        .btn-group label { color: white; font-size: 10px; flex: 1; text-align: center; font-weight: bold; text-transform: uppercase; }
        .ctrl-btn { width: 55px; height: 55px; background: white; color: var(--blue); border: none; font-size: 24px; font-weight: bold; }
        .btn-action { height: 55px; border-radius: 12px; border: none; font-weight: bold; color: white; flex: 1; font-size: 14px; }
        .btn-align { background: #f39c12; }
        .btn-green { background: #2ecc71; flex: 2; }
        .btn-red { background: #e74c3c; width: 55px; }

        /* TEXTE STYLES */
        h1 { margin: 0; font-size: 24pt; text-transform: uppercase; border-bottom: 2px solid black; padding-bottom: 5px; }
        h2 { margin: 0; font-size: 18pt; font-weight: bold; }
        p { margin: 0; font-size: 12pt; white-space: pre-wrap; line-height: 1.5; }

        @media print {
            .toolbar, .controls-panel, .page-break-line, .edit-zone { display: none !important; }
            body { background: white; padding: 0; }
            #viewport { padding: 0; }
            #paper-container { transform: none !important; box-shadow: none; margin: 0; width: 100%; }
            .block.active { border: none !important; background: none !important; }
        }

        /* ADAPTATION MOBILE ÉCRAN */
        @media screen and (max-width: 210mm) {
            #paper-container { 
                /* Zoom pour que la feuille 210mm tienne dans la largeur du téléphone */
                transform: scale(calc(100vw / 210mm)); 
            }
        }
    </style>
</head>
<body onclick="closeAll()">

<div class="toolbar">
    <button onclick="addBlock('h1')">H1</button>
    <button onclick="addBlock('h2')">H2</button>
    <button onclick="addBlock('p')">TXT</button>
    <button onclick="addBlock('img')">IMG</button>
    <button style="background:#27ae60; color:white" onclick="window.print()">PDF</button>
</div>

<div id="viewport">
    <div id="paper-container">
        <div id="paper"></div>
        <div class="page-break-line" style="top: 297mm;"></div>
        <div class="page-break-line" style="top: 594mm;"></div>
        <div class="page-break-line" style="top: 891mm;"></div>
        <div class="page-break-line" style="top: 1188mm;"></div>
    </div>
</div>

<div id="master-controls" class="controls-panel" onclick="event.stopPropagation()">
    <div class="control-row">
        <div class="btn-group">
            <button class="ctrl-btn" onclick="triggerSize(-1)">-</button>
            <label id="label-size">TAILLE</label>
            <button class="ctrl-btn" onclick="triggerSize(1)">+</button>
        </div>
        <div class="btn-group">
            <button class="ctrl-btn" onclick="triggerWidth(-10)">-</button>
            <label>LARG.</label>
            <button class="ctrl-btn" onclick="triggerWidth(10)">+</button>
        </div>
    </div>
    <div class="control-row">
        <div class="btn-group">
            <button class="ctrl-btn" onclick="triggerMargin(-5)">-</button>
            <label>ESPACE</label>
            <button class="ctrl-btn" onclick="triggerMargin(5)">+</button>
        </div>
        <button class="btn-action btn-align" onclick="triggerAlign()">ALIGNER</button>
    </div>
    <div class="control-row">
        <button class="btn-action btn-green" onclick="closeAll()">TERMINER</button>
        <button class="btn-action btn-red" onclick="triggerDelete()">✕</button>
    </div>
</div>

<script>
    let activeBlock = null;

    function addBlock(type) {
        const paper = document.getElementById('paper');
        const div = document.createElement('div');
        div.className = 'block';
        div.dataset.type = type;
        div.dataset.marginBottom = "10"; 
        div.dataset.widthPercent = "100";
        div.dataset.align = "center";
        
        if(type === 'img') div.dataset.height = "60"; 
        else div.dataset.fontSize = "16"; 

        div.onclick = function(e) { e.stopPropagation(); selectBlock(this); };

        div.innerHTML = type === 'img' ? 
            `<div class="edit-zone" style="padding:20px; text-align:center;"><input type="file" multiple accept="image/*" onchange="handleFiles(this)" style="font-size:16px;"></div><div class="view-zone img-grid" style="display:none;"></div>` :
            `<div class="edit-zone" style="padding:15px; background:#f4f4f4; border-radius:10px;"><textarea style="width:100%; height:100px; font-size:16px; border:1px solid #ccc;"></textarea><button onclick="validateText(event, this)" style="width:100%; padding:15px; margin-top:10px; background:#2ecc71; color:white; border:none; border-radius:8px; font-weight:bold;">OK</button></div><div class="view-zone" style="display:none;"></div>`;

        paper.appendChild(div);
    }

    function handleFiles(input) {
        const block = input.closest('.block');
        const view = block.querySelector('.view-zone');
        const files = Array.from(input.files);
        if(!files.length) return;
        view.innerHTML = "";
        let cols = files.length === 1 ? 1 : (files.length === 2 || files.length === 4 ? 2 : 3);
        view.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
        files.forEach(file => {
            const reader = new FileReader();
            reader.onload = (e) => {
                const wrap = document.createElement('div');
                wrap.innerHTML = `<img src="${e.target.result}">`;
                view.appendChild(wrap);
                applyStyles(block);
            };
            reader.readAsDataURL(file);
        });
        block.querySelector('.edit-zone').style.display = 'none';
        view.style.display = 'grid';
        selectBlock(block);
    }

    function validateText(e, btn) {
        e.stopPropagation();
        const block = btn.closest('.block');
        const txt = block.querySelector('textarea').value;
        const view = block.querySelector('.view-zone');
        const tag = block.dataset.type === 'h1' ? 'h1' : (block.dataset.type === 'h2' ? 'h2' : 'p');
        view.innerHTML = `<${tag} style="margin:0;">${txt}</${tag}>`;
        block.querySelector('.edit-zone').style.display = 'none';
        view.style.display = 'block';
        applyStyles(block);
        selectBlock(block);
    }

    function applyStyles(block) {
        block.style.width = block.dataset.widthPercent + "%";
        block.style.marginBottom = block.dataset.marginBottom + "px";
        const align = block.dataset.align;
        block.style.marginLeft = (align === 'right' || align === 'center') ? 'auto' : '0';
        block.style.marginRight = (align === 'left' || align === 'center') ? 'auto' : '0';

        if(block.dataset.type === 'img') {
            block.querySelectorAll('.img-grid div').forEach(d => d.style.height = block.dataset.height + "mm");
        } else {
            const el = block.querySelector('.view-zone').firstElementChild;
            if(el) el.style.fontSize = block.dataset.fontSize + "pt";
        }
    }

    function selectBlock(el) {
        if (el.querySelector('.view-zone').style.display === 'none') return;
        closeAll();
        activeBlock = el;
        el.classList.add('active');
        document.body.classList.add('active-block-exists');
        document.getElementById('label-size').innerText = el.dataset.type === 'img' ? 'HAUT.' : 'TAILLE';
    }

    function closeAll() {
        document.querySelectorAll('.block').forEach(b => b.classList.remove('active'));
        document.body.classList.remove('active-block-exists');
        activeBlock = null;
    }

    function triggerSize(delta) {
        if(!activeBlock) return;
        if (activeBlock.dataset.type === 'img') activeBlock.dataset.height = Math.max(10, parseFloat(activeBlock.dataset.height) + (delta * 10));
        else activeBlock.dataset.fontSize = Math.max(8, parseFloat(activeBlock.dataset.fontSize) + (delta * 2));
        applyStyles(activeBlock);
    }

    function triggerWidth(delta) {
        if(!activeBlock) return;
        activeBlock.dataset.widthPercent = Math.min(100, Math.max(10, parseFloat(activeBlock.dataset.widthPercent) + delta));
        applyStyles(activeBlock);
    }

    function triggerMargin(delta) {
        if(!activeBlock) return;
        activeBlock.dataset.marginBottom = Math.max(0, parseFloat(activeBlock.dataset.marginBottom) + delta);
        applyStyles(activeBlock);
    }

    function triggerAlign() {
        if(!activeBlock) return;
        const states = ['left', 'center', 'right'];
        activeBlock.dataset.align = states[(states.indexOf(activeBlock.dataset.align) + 1) % 3];
        applyStyles(activeBlock);
    }

    function triggerDelete() {
        if(activeBlock && confirm('Supprimer ce bloc ?')) { activeBlock.remove(); closeAll(); }
    }
</script>
</body>
</html>

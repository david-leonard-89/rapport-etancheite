<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Générateur de Rapport</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 10px; }
        .toolbar { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 20px; }
        .block { border: 1px solid #ddd; padding: 10px; margin-bottom: 10px; position: relative; }
        .del-btn { position: absolute; top: 5px; right: 5px; color: red; cursor: pointer; font-weight: bold; }
        textarea { width: 90%; margin-top: 5px; }
        img { max-width: 100px; display: block; }
    </style>
</head>
<body>

    <h2>Éditeur de Rapport</h2>
    <div class="toolbar">
        <button onclick="addBlock('h1')">Titre</button>
        <button onclick="addBlock('h2')">S-Titre</button>
        <button onclick="addBlock('p')">Texte</button>
        <button onclick="addBlock('img')">Photo</button>
    </div>

    <div id="content-area"></div>
    <br>
    <button onclick="generatePDF()" style="background: green; color: white; padding: 15px;">Générer le PDF</button>

    <script>
        function addBlock(type) {
            const area = document.getElementById('content-area');
            const div = document.createElement('div');
            div.className = 'block';
            div.dataset.type = type;

            div.innerHTML = `<span class="del-btn" onclick="this.parentElement.remove()">X</span>`;

            if (type === 'img') {
                div.innerHTML += `<input type="file" accept="image/*" onchange="previewImg(this)">`;
            } else {
                div.innerHTML += `<textarea placeholder="Saisir ${type}..."></textarea>`;
            }
            area.appendChild(div);
        }

        function previewImg(input) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = document.createElement('img');
                img.src = e.target.result;
                input.parentElement.appendChild(img);
            };
            reader.readAsDataURL(input.files[0]);
        }

        async function generatePDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            let y = 20;

            const blocks = document.querySelectorAll('.block');
            blocks.forEach(block => {
                const type = block.dataset.type;
                if (type === 'h1') {
                    doc.setFontSize(22);
                    doc.text(block.querySelector('textarea').value, 10, y);
                    y += 15;
                } else if (type === 'h2') {
                    doc.setFontSize(16);
                    doc.text(block.querySelector('textarea').value, 10, y);
                    y += 10;
                } else if (type === 'p') {
                    doc.setFontSize(12);
                    const lines = doc.splitTextToSize(block.querySelector('textarea').value, 180);
                    doc.text(lines, 10, y);
                    y += (lines.length * 7);
                } else if (type === 'img') {
                    const img = block.querySelector('img');
                    if (img) {
                        doc.addImage(img.src, 'JPEG', 10, y, 100, 75);
                        y += 85;
                    }
                }
                if (y > 270) { doc.addPage(); y = 20; }
            });
            doc.save("mon-rapport.pdf");
        }
    </script>
</body>
</html>

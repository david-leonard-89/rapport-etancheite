<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rapport Expert v8 - Photo Control</title>
    <style>
        :root { --p-width: 210mm; --p-height: 297mm; }
        body { background: #1a1a1a; margin: 0; padding-top: 60px; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; }
        
        .toolbar { position: fixed; top: 0; width: 100%; background: #000; padding: 10px; display: flex; justify-content: center; gap: 10px; z-index: 2000; }
        .toolbar button { padding: 12px; border-radius: 8px; border: none; cursor: pointer; background: #fff; font-weight: bold; }

        #paper-container { width: var(--p-width); background: white; box-shadow: 0 0 30px rgba(0,0,0,0.7); margin-bottom: 250px; position: relative; }
        
        .page-break-line { position: absolute; left: 0; width: 100%; height: 2px; background: rgba(255, 0, 0, 0.2); border-top: 1px dashed red; pointer-events: none; z-index: 500; display: flex; justify-content: center; }
        .page-break-line::after { content: "LIMITE PAGE"; background: red; color: white; font-size: 8px; padding: 2px 5px; height: 10px; }

        #paper { width: 100%; padding: 15mm; box-sizing: border-box; min-height: var(--p-height); display: flex; flex-direction: column; align-items: center; }

        .block { position: relative; margin-bottom: 10px; border: 2px solid transparent; width: 100%; box-sizing: border-box; transition: 0.2s; }
        .block.active { border: 2px solid #3498db; background: #f0f8ff; }
        
        /* GRILLE PHOTO AMÉLIORÉE */
        .img-grid { 
            display: grid; 
            gap: 5px; 
            width: 100%; 
            margin: 0 auto;
        }
        .img-grid div { width: 100%; overflow: hidden; background: #eee; }
        .img-grid img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; /* L'image remplit la case sans déformation */
            display: block;
        }

        /* TOOLBAR FIXE */
        .controls-panel { 
            display: none; position: fixed; bottom: 0; left: 0; width: 100%;
            background: #2c3e50; padding: 15px; border-top: 4px solid #3498db;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.5); z-index: 3000;
            flex-direction: column; gap: 12px;
        }
        .active-block-exists .controls-panel { display: flex; }
        
        .control-row { display: flex; justify-content: space-around; align-items: center; gap: 5px; }
        .control-group { display: flex; align-items: center; gap: 8px; }
        .control-group label { color: white; font-weight: bold; font-size: 10px; text-transform: uppercase; width: 45px; }
        
        .ctrl-btn { width: 50px; height: 50px; background: white; color: #3498db; border: none; border-radius: 10px; font-size: 24px; font-weight: bold; cursor: pointer; }
        .btn-action { padding: 10px; border-radius: 8px; border: none; font-weight: bold; height: 50px; cursor: pointer; color: white; }
        .btn-green { background: #2ecc71; flex-grow: 1; }
        .btn-red { background: #e74c3c; width: 50px; }

        @media print {
            .toolbar, .controls-panel, .page-break-line { display: none !important; }
            #paper-container { box-shadow: none; margin: 0; width: 100%; }
            .block.active { border: none !important; background: none !important; }
        }

        @media screen and (max-width: 210mm) {
            #paper-container { transform: scale(calc(100vw / 220mm)); transform-origin: top center; }
        }
    </style>
</head>
<body onclick="closeAll()">

<div class="toolbar">
    <button onclick="addBlock('h1')">H1</button>
    <button onclick="addBlock('h2')">H2</button>
    <button onclick="addBlock('p')">TEXTE</button>
    <button onclick="addBlock('img')">PHOTOS</button>
    <button style="background:#27ae60; color:white" onclick="window.print()">PDF</button>
</div>

<div id="paper-container">
    <div id="paper"></div>
    <div class="page-break-line" style="top: 297mm;"></div>
    <div class="page-break-line" style="top: 594mm;"></div>
</div>

<div id="master-controls" class="controls-panel" onclick="event.stopPropagation()">
    <div class="control-row">
        <div class="control-group">
            <label id="label-size">HAUTEUR</label>
            <button class="ctrl-btn" onclick="triggerSize(-1)">-</button>
            <button class="ctrl-btn" onclick="triggerSize(1)">+</button>
        </div>
        <div class="control-group" id="width-control-group">
            <label>LARGEUR</label>
            <button class="ctrl-btn" onclick="triggerWidth(-10)">-</button>
            <button class="ctrl-btn" onclick="triggerWidth(10)">+</button>
        </div>
    </div>
    <div class="control-row">
        <div class="control-group" style="width:100%; justify-content: center;">
            <label>ESPACE BAS</label>
            <button class="ctrl-btn" onclick="triggerMargin(-5)">-</button>
            <button class="ctrl-btn" onclick="triggerMargin(5)">+</button>
        </div>
    </div>
    <div class="control-row">
        <button class="btn-action btn-green" onclick="closeAll()">TERMINER</button>
        <button class="btn-action btn-red" onclick="triggerDelete()">✕</button>
    </div>
</div>

<script>
    let activeBlock = null;

    function addBlock(type) {
        const paper = document.getElementById('paper');
        const div = document.createElement('div');
        div.className = 'block';
        div.dataset.type = type;
        div.dataset.marginBottom = "10"; 
        div.dataset.widthPercent = "100"; // Largeur par défaut
        
        if(type === 'img') div.dataset.height = "60"; 
        else div.dataset.fontSize = "16"; 

        div.onclick = function(e) { e.stopPropagation(); selectBlock(this); };

        div.innerHTML = type === 'img' ? 
            `<div class="edit-zone" style="padding:20px; background:#f9f9f9; text-align:center;">
                <input type="file" multiple accept="image/*" onchange="handleFiles(this)">
             </div><div class="view-zone img-grid" style="display:none;"></div>` :
            `<div class="edit-zone" style="padding:10px;"><textarea style="width:100%; height:80px;"></textarea><button onclick="validateText(event, this)" style="width:100%; padding:10px; margin-top:5px; background:#27ae60; color:white; border:none; border-radius:5px;">VALIDER</button></div><div class="view-zone" style="display:none;"></div>`;

        paper.appendChild(div);
    }

    function handleFiles(input) {
        const block = input.closest('.block');
        const view = block.querySelector('.view-zone');
        const files = Array.from(input.files);
        if(!files.length) return;

        view.innerHTML = "";
        let cols = files.length === 1 ? 1 : (files.length === 2 || files.length === 4 ? 2 : 3);
        view.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;

        files.forEach(file => {
            const reader = new FileReader();
            reader.onload = (e) => {
                const wrap = document.createElement('div');
                wrap.innerHTML = `<img src="${e.target.result}">`;
                view.appendChild(wrap);
                updatePhotoStyles(block);
            };
            reader.readAsDataURL(file);
        });

        block.querySelector('.edit-zone').style.display = 'none';
        view.style.display = 'grid';
        selectBlock(block);
    }

    function validateText(e, btn) {
        e.stopPropagation();
        const block = btn.closest('.block');
        const txt = block.querySelector('textarea').value;
        const view = block.querySelector('.view-zone');
        const tag = block.dataset.type === 'h1' ? 'h1' : (block.dataset.type === 'h2' ? 'h2' : 'p');
        view.innerHTML = `<${tag} style="margin:0;">${txt}</${tag}>`;
        block.querySelector('.edit-zone').style.display = 'none';
        view.style.display = 'block';
        applyStyles(block);
        selectBlock(block);
    }

    function selectBlock(el) {
        closeAll();
        activeBlock = el;
        el.classList.add('active');
        document.body.classList.add('active-block-exists');
        document.getElementById('label-size').innerText = el.dataset.type === 'img' ? 'HAUTEUR' : 'TAILLE';
    }

    function closeAll() {
        document.querySelectorAll('.block').forEach(b => b.classList.remove('active'));
        document.body.classList.remove('active-block-exists');
        activeBlock = null;
    }

    function triggerSize(delta) {
        if(!activeBlock) return;
        if (activeBlock.dataset.type === 'img') {
            activeBlock.dataset.height = Math.max(10, parseFloat(activeBlock.dataset.height) + (delta * 10));
            updatePhotoStyles(activeBlock);
        } else {
            activeBlock.dataset.fontSize = Math.max(8, parseFloat(activeBlock.dataset.fontSize) + (delta * 2));
            applyStyles(activeBlock);
        }
    }

    function triggerWidth(delta) {
        if(!activeBlock) return;
        activeBlock.dataset.widthPercent = Math.min(100, Math.max(20, parseFloat(activeBlock.dataset.widthPercent) + delta));
        applyStyles(activeBlock);
    }

    function triggerMargin(delta) {
        if(!activeBlock) return;
        activeBlock.dataset.marginBottom = Math.max(0, parseFloat(activeBlock.dataset.marginBottom) + delta);
        applyStyles(activeBlock);
    }

    function applyStyles(block) {
        block.style.width = block.dataset.widthPercent + "%";
        block.style.marginBottom = block.dataset.marginBottom + "px";
        if(block.dataset.type !== 'img') {
            const textEl = block.querySelector('.view-zone').firstElementChild;
            if(textEl) textEl.style.fontSize = block.dataset.fontSize + "pt";
        } else {
            updatePhotoStyles(block);
        }
    }

    function updatePhotoStyles(block) {
        const view = block.querySelector('.view-zone');
        const containers = view.querySelectorAll('div');
        containers.forEach(c => {
            c.style.height = block.dataset.height + "mm";
        });
        block.style.width = block.dataset.widthPercent + "%";
        block.style.marginBottom = block.dataset.marginBottom + "px";
    }

    function triggerDelete() {
        if(activeBlock && confirm('Supprimer ?')) { activeBlock.remove(); closeAll(); }
    }
</script>
</body>
</html>

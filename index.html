<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Générateur de Rapport</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body { font-family: sans-serif; padding-top: 70px; background: #f4f4f9; }
        .toolbar { position: fixed; top: 0; width: 100%; background: white; padding: 10px; display: flex; align-items: center; gap: 5px; z-index: 1000; border-bottom: 1px solid #ccc; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .toolbar button { padding: 8px; cursor: pointer; }
        .btn-pdf { background: green; color: white; margin-left: auto; margin-right: 15px; font-weight: bold; }
        
        .block { border: 1px solid #ccc; padding: 15px; margin: 10px; background: white; border-radius: 8px; position: relative; }
        .del-btn { position: absolute; top: 5px; right: 5px; color: #ff4d4d; cursor: pointer; }
        
        .view-mode { cursor: pointer; }
        .h1-view { font-size: 24px; font-weight: bold; }
        .h2-view { font-size: 18px; font-weight: bold; color: #444; }
        .p-view { font-size: 14px; line-height: 1.5; }
        
        .img-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 10px; margin-top: 10px; }
        .img-grid img { width: 100%; height: 80px; object-fit: cover; border-radius: 4px; }
    </style>
</head>
<body>

    <div class="toolbar">
        <button onclick="addBlock('h1')">Titre</button>
        <button onclick="addBlock('h2')">S-Titre</button>
        <button onclick="addBlock('p')">Texte</button>
        <button onclick="addBlock('img')">Photo</button>
        <button class="btn-pdf" onclick="generatePDF()">PDF</button>
    </div>

    <div id="content-area"></div>

    <script>
        function addBlock(type) {
            const div = document.createElement('div');
            div.className = 'block';
            div.dataset.type = type;
            div.innerHTML = `<span class="del-btn" onclick="this.parentElement.remove()">X</span>`;
            
            if (type === 'img') {
                div.innerHTML += `<input type="file" accept="image/*" multiple onchange="handleImages(this)">
                                  <div class="img-grid"></div>`;
            } else {
                div.innerHTML += `<div class="edit-mode"><textarea placeholder="Saisir ${type}..." onkeydown="checkEnter(event)"></textarea></div>
                                  <div class="view-mode ${type}-view" style="display:none;" onclick="editBlock(this)"></div>`;
            }
            document.getElementById('content-area').appendChild(div);
        }

        function checkEnter(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                validate(e.target.nextElementSibling || e.target.parentElement.querySelector('button') || e.target);
            }
        }

        function validate(el) {
            const block = el.closest('.block');
            const textarea = block.querySelector('textarea');
            const view = block.querySelector('.view-mode');
            view.innerText = textarea.value;
            view.style.display = 'block';
            block.querySelector('.edit-mode').style.display = 'none';
        }

        function editBlock(el) {
            el.style.display = 'none';
            const block = el.closest('.block');
            block.querySelector('.edit-mode').style.display = 'block';
        }

        function handleImages(input) {
            const grid = input.parentElement.querySelector('.img-grid');
            Array.from(input.files).forEach(file => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = document.createElement('img');
                    img.src = e.target.result;
                    grid.appendChild(img);
                };
                reader.readAsDataURL(file);
            });
            input.style.display = 'none';
        }

        async function generatePDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            let y = 20;

            document.querySelectorAll('.block').forEach(block => {
                const type = block.dataset.type;
                if (type === 'h1' || type === 'h2' || type === 'p') {
                    const text = block.querySelector('.view-mode').innerText;
                    doc.setFontSize(type === 'h1' ? 22 : type === 'h2' ? 16 : 12);
                    doc.text(doc.splitTextToSize(text, 180), 10, y);
                    y += (type === 'p' ? 10 : 15);
                } else if (type === 'img') {
                    block.querySelectorAll('img').forEach((img, i) => {
                        const w = 60; const h = 45;
                        if (y + h > 280) { doc.addPage(); y = 20; }
                        doc.addImage(img.src, 'JPEG', 10 + (i%3)*65, y, w, h);
                        if (i % 3 === 2) y += 50;
                    });
                    y += 50;
                }
            });
            doc.save("rapport.pdf");
        }
    </script>
</body>
</html>

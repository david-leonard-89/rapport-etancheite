<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expert Rapport Étanchéité</title>
    <style>
        /* --- INTERFACE ÉDITEUR --- */
        :root { --p-width: 210mm; --p-height: 297mm; }
        body { background: #3a3a3a; margin: 0; padding-top: 70px; font-family: 'Helvetica', sans-serif; }
        
        .toolbar { 
            position: fixed; top: 0; width: 100%; background: #1a1a1a; padding: 10px; 
            display: flex; justify-content: center; gap: 10px; z-index: 2000; 
        }
        .toolbar button { 
            background: #444; color: white; border: 1px solid #666; padding: 8px 15px; 
            border-radius: 5px; cursor: pointer; font-weight: bold;
        }
        .btn-pdf { background: #27ae60 !important; border: none !important; }

        /* --- STRUCTURE DES PAGES --- */
        #container { display: flex; flex-direction: column; align-items: center; padding-bottom: 50px; }
        
        .page {
            width: var(--p-width);
            height: var(--p-height);
            background: white;
            margin-bottom: 20px;
            padding: 15mm;
            box-sizing: border-box;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            overflow: hidden; /* Empêche le débordement invisible */
        }

        /* Indicateur de débordement (Le fameux "blanc" ou saut de ligne forcé) */
        .page::after {
            content: "FIN DE PAGE";
            position: absolute; bottom: 0; left: 0; width: 100%;
            background: rgba(255, 0, 0, 0.1); color: red;
            text-align: center; font-size: 10px; border-top: 1px dashed red;
            pointer-events: none;
        }

        /* --- CONTENU DU RAPPORT --- */
        .block { margin-bottom: 5mm; position: relative; border: 1px solid transparent; transition: 0.2s; }
        .block:hover { border: 1px dashed #4facfe; }
        
        .del-btn { 
            position: absolute; right: -40px; top: 0; color: #ff4d4d; 
            cursor: pointer; background: white; border-radius: 50%; width: 25px; height: 25px;
            display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        h1 { font-size: 22pt; text-transform: uppercase; margin: 10px 0; border-bottom: 2px solid #000; }
        h2 { font-size: 16pt; text-transform: uppercase; margin: 8px 0; color: #444; border-bottom: 1px solid #eee; }
        p { font-size: 11pt; margin: 5px 0; white-space: pre-wrap; word-wrap: break-word; }

        .img-grid { 
            display: grid; gap: 5px; margin-top: 5px;
            grid-template-columns: repeat(var(--cols, 1), 1fr);
        }
        .img-grid img { width: 100%; height: auto; object-fit: cover; display: block; }

        /* Zone d'édition (visible seulement à l'écran) */
        .edit-zone { background: #f1faff; padding: 10px; border-radius: 5px; margin-bottom: 5px; }
        textarea { width: 100%; border: 1px solid #bedfff; border-radius: 3px; padding: 8px; font-size: 14px; }

        /* --- RENDU PDF / IMPRESSION --- */
        @media print {
            body { background: white; padding: 0; }
            .toolbar, .del-btn, .edit-zone, .page::after { display: none !important; }
            #container { display: block; }
            .page { 
                margin: 0 !important; box-shadow: none !important; 
                page-break-after: always; width: 100%; height: var(--p-height);
            }
        }

        /* Adaptation mobile de l'éditeur */
        @media screen and (max-width: 210mm) {
            #container { transform: scale(calc(100vw / 230)); transform-origin: top center; }
            body { padding-top: 10px; }
            .toolbar { position: static; margin-bottom: 110px; flex-wrap: wrap; }
        }
    </style>
</head>
<body>

    <div class="toolbar">
        <button onclick="addBlock('h1')">TITRE</button>
        <button onclick="addBlock('h2')">S-TITRE</button>
        <button onclick="addBlock('p')">TEXTE</button>
        <button onclick="addBlock('img')">PHOTOS</button>
        <button class="btn-pdf" onclick="window.print()">GÉNÉRER PDF</button>
    </div>

    <div id="container">
        <div class="page" id="page-1"></div>
    </div>

    <script>
        let currentPageId = 1;

        function addBlock(type) {
            const activePage = document.getElementById(`page-${currentPageId}`);
            const div = document.createElement('div');
            div.className = 'block';
            div.dataset.type = type;

            let html = `<span class="del-btn" onclick="removeBlock(this)">✕</span>`;

            if (type === 'img') {
                html += `<div class="edit-zone"><input type="file" multiple accept="image/*" onchange="handleImages(this)"></div><div class="img-grid"></div>`;
            } else {
                html += `<div class="edit-zone"><textarea placeholder="Saisir ${type}..."></textarea><button onclick="validate(this)">OK</button></div><div class="view-zone" style="display:none;" onclick="edit(this)"></div>`;
            }

            div.innerHTML = html;
            activePage.appendChild(div);
            checkOverflow(activePage);
        }

        function validate(btn) {
            const block = btn.closest('.block');
            const text = block.querySelector('textarea').value;
            const view = block.querySelector('.view-zone');
            const tag = (block.dataset.type === 'h1') ? 'h1' : (block.dataset.type === 'h2') ? 'h2' : 'p';
            
            view.innerHTML = `<${tag}>${text}</${tag}>`;
            block.querySelector('.edit-zone').style.display = 'none';
            view.style.display = 'block';
            checkOverflow(block.parentElement);
        }

        function edit(view) {
            view.style.display = 'none';
            view.previousElementSibling.style.display = 'block';
        }

        function handleImages(input) {
            const grid = input.parentElement.nextElementSibling;
            const files = Array.from(input.files);
            let cols = files.length === 1 ? 1 : (files.length === 2 || files.length === 4 ? 2 : 3);
            grid.style.setProperty('--cols', cols);

            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = document.createElement('img');
                    img.src = e.target.result;
                    grid.appendChild(img);
                    setTimeout(() => checkOverflow(grid.closest('.page')), 200);
                };
                reader.readAsDataURL(file);
            });
            input.parentElement.style.display = 'none';
        }

        function checkOverflow(page) {
            // Si le contenu dépasse la hauteur de la page (297mm soit environ 1122px)
            if (page.scrollHeight > page.clientHeight + 2) {
                const nextPageId = parseInt(page.id.split('-')[1]) + 1;
                if (!document.getElementById(`page-${nextPageId}`)) {
                    const newPage = document.createElement('div');
                    newPage.className = 'page';
                    newPage.id = `page-${nextPageId}`;
                    document.getElementById('container').appendChild(newPage);
                    currentPageId = nextPageId;
                }
                // Optionnel : On peut déplacer automatiquement le dernier bloc, 
                // mais ici on laisse l'utilisateur voir le dépassement en rouge.
            }
        }

        function removeBlock(btn) {
            const page = btn.closest('.page');
            btn.parentElement.remove();
            // Si une page devient vide (sauf la première), on peut la supprimer
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rapport Expert v9</title>
    <style>
        :root { --p-width: 210mm; --p-height: 297mm; }
        body { background: #1a1a1a; margin: 0; padding-top: 60px; font-family: 'Segoe UI', sans-serif; }
        
        .toolbar { position: fixed; top: 0; width: 100%; background: #000; padding: 10px; display: flex; justify-content: center; gap: 10px; z-index: 2000; }
        .toolbar button { padding: 10px; border-radius: 8px; border: none; cursor: pointer; background: #fff; font-weight: bold; }

        #paper-container { width: var(--p-width); background: white; margin: 20px auto 250px auto; position: relative; min-height: var(--p-height); box-shadow: 0 0 30px rgba(0,0,0,0.7); }
        
        #paper { width: 100%; padding: 15mm; box-sizing: border-box; display: flex; flex-direction: column; }

        .block { position: relative; margin-bottom: 10px; border: 2px solid transparent; box-sizing: border-box; display: block; overflow: hidden; }
        .block.active { border: 2px solid #3498db; background: #f0f8ff; }
        
        /* GRILLE PHOTO */
        .img-grid { display: grid; gap: 8px; width: 100%; }
        .img-grid div { width: 100%; background: #f0f0f0; display: flex; align-items: center; justify-content: center; }
        .img-grid img { width: 100%; height: 100%; object-fit: cover; }

        /* TOOLBAR FIXE COMPACTE */
        .controls-panel { 
            display: none; position: fixed; bottom: 0; left: 0; width: 100%;
            background: #2c3e50; padding: 10px; border-top: 4px solid #3498db;
            z-index: 3000; flex-direction: column; gap: 8px;
        }
        .active-block-exists .controls-panel { display: flex; }
        
        .control-row { display: flex; justify-content: center; align-items: center; gap: 10px; flex-wrap: nowrap; }
        .btn-group { display: flex; align-items: center; background: #34495e; border-radius: 10px; padding: 2px; }
        .btn-group label { color: white; font-size: 9px; padding: 0 8px; text-transform: uppercase; font-weight: bold; }
        
        .ctrl-btn { width: 45px; height: 45px; background: white; color: #3498db; border: 1px solid #ddd; border-radius: 8px; font-size: 20px; font-weight: bold; cursor: pointer; margin: 2px; }
        .btn-action { height: 45px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; color: white; padding: 0 15px; }
        .btn-align { background: #f39c12; min-width: 80px; }
        .btn-green { background: #2ecc71; flex-grow: 1; }
        .btn-red { background: #e74c3c; width: 45px; }

        /* LIGNE DE COUPE */
        .page-break-line { position: absolute; left: 0; width: 100%; height: 1px; border-top: 2px dashed rgba(255,0,0,0.3); pointer-events: none; }

        @media print {
            .toolbar, .controls-panel, .page-break-line { display: none !important; }
            #paper-container { margin: 0; box-shadow: none; width: 100%; }
            .block.active { border: none !important; background: none !important; }
        }
    </style>
</head>
<body onclick="closeAll()">

<div class="toolbar">
    <button onclick="addBlock('h1')">H1</button>
    <button onclick="addBlock('h2')">H2</button>
    <button onclick="addBlock('p')">TXT</button>
    <button onclick="addBlock('img')">IMG</button>
    <button style="background:#27ae60; color:white" onclick="window.print()">PDF</button>
</div>

<div id="paper-container">
    <div id="paper"></div>
    <div class="page-break-line" style="top: 297mm;"></div>
    <div class="page-break-line" style="top: 594mm;"></div>
</div>

<div id="master-controls" class="controls-panel" onclick="event.stopPropagation()">
    <div class="control-row">
        <div class="btn-group">
            <label id="label-size">Taille</label>
            <button class="ctrl-btn" onclick="triggerSize(-1)">-</button>
            <button class="ctrl-btn" onclick="triggerSize(1)">+</button>
        </div>
        <div class="btn-group">
            <label>Largeur</label>
            <button class="ctrl-btn" onclick="triggerWidth(-10)">-</button>
            <button class="ctrl-btn" onclick="triggerWidth(10)">+</button>
        </div>
    </div>
    <div class="control-row">
        <div class="btn-group">
            <label>Marge</label>
            <button class="ctrl-btn" onclick="triggerMargin(-5)">-</button>
            <button class="ctrl-btn" onclick="triggerMargin(5)">+</button>
        </div>
        <button class="btn-action btn-align" onclick="triggerAlign()">ALIGNER</button>
    </div>
    <div class="control-row">
        <button class="btn-action btn-green" onclick="closeAll()">TERMINER</button>
        <button class="btn-action btn-red" onclick="triggerDelete()">✕</button>
    </div>
</div>

<script>
    let activeBlock = null;

    function addBlock(type) {
        const paper = document.getElementById('paper');
        const div = document.createElement('div');
        div.className = 'block';
        div.dataset.type = type;
        div.dataset.marginBottom = "10"; 
        div.dataset.widthPercent = "100";
        div.dataset.align = "center"; // center, left, right
        
        if(type === 'img') div.dataset.height = "60"; 
        else div.dataset.fontSize = "16"; 

        div.onclick = function(e) { e.stopPropagation(); selectBlock(this); };

        div.innerHTML = type === 'img' ? 
            `<div class="edit-zone" style="padding:15px; text-align:center;"><input type="file" multiple accept="image/*" onchange="handleFiles(this)"></div><div class="view-zone img-grid" style="display:none;"></div>` :
            `<div class="edit-zone" style="padding:10px;"><textarea style="width:100%; height:60px;"></textarea><button onclick="validateText(event, this)" style="width:100%; padding:10px; margin-top:5px; background:#27ae60; color:white; border:none;">OK</button></div><div class="view-zone" style="display:none;"></div>`;

        paper.appendChild(div);
    }

    function handleFiles(input) {
        const block = input.closest('.block');
        const view = block.querySelector('.view-zone');
        const files = Array.from(input.files);
        if(!files.length) return;

        view.innerHTML = "";
        let cols = files.length === 1 ? 1 : (files.length === 2 || files.length === 4 ? 2 : 3);
        view.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;

        files.forEach(file => {
            const reader = new FileReader();
            reader.onload = (e) => {
                const wrap = document.createElement('div');
                wrap.innerHTML = `<img src="${e.target.result}">`;
                view.appendChild(wrap);
                applyStyles(block);
            };
            reader.readAsDataURL(file);
        });

        block.querySelector('.edit-zone').style.display = 'none';
        view.style.display = 'grid';
        selectBlock(block);
    }

    function validateText(e, btn) {
        e.stopPropagation();
        const block = btn.closest('.block');
        const txt = block.querySelector('textarea').value;
        const view = block.querySelector('.view-zone');
        const tag = block.dataset.type === 'h1' ? 'h1' : (block.dataset.type === 'h2' ? 'h2' : 'p');
        view.innerHTML = `<${tag} style="margin:0;">${txt}</${tag}>`;
        block.querySelector('.edit-zone').style.display = 'none';
        view.style.display = 'block';
        applyStyles(block);
        selectBlock(block);
    }

    function selectBlock(el) {
        closeAll();
        activeBlock = el;
        el.classList.add('active');
        document.body.classList.add('active-block-exists');
        document.getElementById('label-size').innerText = el.dataset.type === 'img' ? 'Haut.' : 'Taille';
    }

    function closeAll() {
        document.querySelectorAll('.block').forEach(b => b.classList.remove('active'));
        document.body.classList.remove('active-block-exists');
        activeBlock = null;
    }

    function triggerSize(delta) {
        if(!activeBlock) return;
        if (activeBlock.dataset.type === 'img') {
            activeBlock.dataset.height = Math.max(10, parseFloat(activeBlock.dataset.height) + (delta * 10));
        } else {
            activeBlock.dataset.fontSize = Math.max(8, parseFloat(activeBlock.dataset.fontSize) + (delta * 2));
        }
        applyStyles(activeBlock);
    }

    function triggerWidth(delta) {
        if(!activeBlock) return;
        activeBlock.dataset.widthPercent = Math.min(100, Math.max(10, parseFloat(activeBlock.dataset.widthPercent) + delta));
        applyStyles(activeBlock);
    }

    function triggerMargin(delta) {
        if(!activeBlock) return;
        activeBlock.dataset.marginBottom = Math.max(0, parseFloat(activeBlock.dataset.marginBottom) + delta);
        applyStyles(activeBlock);
    }

    function triggerAlign() {
        if(!activeBlock) return;
        const states = ['left', 'center', 'right'];
        let idx = states.indexOf(activeBlock.dataset.align);
        activeBlock.dataset.align = states[(idx + 1) % 3];
        applyStyles(activeBlock);
    }

    function applyStyles(block) {
        // Alignement
        const align = block.dataset.align;
        block.style.marginLeft = (align === 'right' || align === 'center') ? 'auto' : '0';
        block.style.marginRight = (align === 'left' || align === 'center') ? 'auto' : '0';
        
        block.style.width = block.dataset.widthPercent + "%";
        block.style.marginBottom = block.dataset.marginBottom + "px";

        if(block.dataset.type === 'img') {
            const divs = block.querySelectorAll('.img-grid div');
            divs.forEach(d => d.style.height = block.dataset.height + "mm");
        } else {
            const textEl = block.querySelector('.view-zone').firstElementChild;
            if(textEl) textEl.style.fontSize = block.dataset.fontSize + "pt";
        }
    }

    function triggerDelete() {
        if(activeBlock && confirm('Supprimer ?')) { activeBlock.remove(); closeAll(); }
    }
</script>
</body>
</html>

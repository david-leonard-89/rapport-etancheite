<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rapport Pro Étanchéité</title>
    <style>
        :root { --p-width: 210mm; --p-height: 297mm; }
        
        /* INTERFACE GÉNÉRALE */
        body { background: #404040; margin: 0; display: flex; flex-direction: column; align-items: center; font-family: Arial, sans-serif; }
        
        .toolbar { 
            position: fixed; top: 0; width: 100%; background: #222; padding: 10px; 
            display: flex; justify-content: center; gap: 5px; z-index: 1000; 
        }
        .toolbar button { padding: 8px; font-size: 12px; font-weight: bold; cursor: pointer; border-radius: 4px; border: none; }
        .btn-pdf { background: #27ae60; color: white; }

        /* CONTENEUR DE PAGES */
        #container { margin-top: 60px; padding-bottom: 50px; }

        .page {
            width: var(--p-width);
            height: var(--p-height);
            background: white;
            margin-bottom: 15px;
            padding: 15mm;
            box-sizing: border-box; /* IMPORTANT : le padding ne réduit pas la zone de travail */
            position: relative;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
            overflow: hidden; /* Rien ne doit dépasser */
        }

        /* Indicateur de fin de page visuel */
        .page::after {
            content: "LIMITE DE PAGE A4";
            position: absolute; bottom: 0; left: 0; width: 100%;
            background: rgba(255, 0, 0, 0.05); color: red;
            text-align: center; font-size: 10px; border-top: 1px dashed red;
        }

        /* CONTENU */
        .block { margin-bottom: 8mm; position: relative; width: 100%; }
        
        h1 { font-size: 20pt; text-transform: uppercase; border-bottom: 2px solid #000; margin: 0 0 5mm 0; }
        h2 { font-size: 14pt; text-transform: uppercase; color: #444; margin: 0 0 3mm 0; }
        p { font-size: 11pt; margin: 0; white-space: pre-wrap; }

        /* GRILLE PHOTO SÉCURISÉE */
        .img-grid { 
            display: grid; 
            gap: 4mm; 
            width: 100%; /* Force la grille à rester dans la page */
            grid-template-columns: repeat(var(--cols, 1), 1fr);
        }
        .img-grid img { 
            width: 100%; 
            height: auto; 
            display: block; 
            object-fit: contain; 
            border: 1px solid #eee;
        }

        .del-btn { position: absolute; right: -35px; top: 0; color: white; background: red; border-radius: 50%; width: 20px; height: 20px; text-align: center; cursor: pointer; }

        /* ÉDITION */
        .edit-zone { background: #f0f7ff; padding: 10px; border-radius: 5px; margin-bottom: 10px; }
        textarea { width: 100%; box-sizing: border-box; min-height: 40px; }

        /* IMPRESSION */
        @media print {
            .toolbar, .del-btn, .edit-zone, .page::after { display: none !important; }
            body { background: white; }
            #container { margin: 0; }
            .page { margin: 0; box-shadow: none; page-break-after: always; }
        }

        /* ADAPTATION MOBILE POUR L'ÉDITEUR */
        @media screen and (max-width: 210mm) {
            #container { 
                transform: scale(calc(100vw / 230mm)); /* Zoom auto pour que ça tienne sur ton écran */
                transform-origin: top center;
                margin-top: 80px;
            }
        }
    </style>
</head>
<body>

    <div class="toolbar">
        <button onclick="addBlock('h1')">TITRE</button>
        <button onclick="addBlock('h2')">S-TITRE</button>
        <button onclick="addBlock('p')">TEXTE</button>
        <button onclick="addBlock('img')">PHOTOS</button>
        <button class="btn-pdf" onclick="window.print()">GÉNÉRER PDF</button>
    </div>

    <div id="container">
        <div class="page" id="page-1"></div>
    </div>

    <script>
        let currentPage = 1;

        function addBlock(type) {
            const page = document.getElementById(`page-${currentPage}`);
            const div = document.createElement('div');
            div.className = 'block';
            div.dataset.type = type;

            let content = `<span class="del-btn" onclick="this.parentElement.remove()">✕</span>`;

            if (type === 'img') {
                content += `<div class="edit-zone"><input type="file" multiple onchange="handleImages(this)"></div><div class="img-grid"></div>`;
            } else {
                content += `<div class="edit-zone"><textarea></textarea><br><button onclick="save(this)">OK</button></div><div class="view" style="display:none;" onclick="edit(this)"></div>`;
            }

            div.innerHTML = content;
            page.appendChild(div);
        }

        function save(btn) {
            const block = btn.closest('.block');
            const txt = block.querySelector('textarea').value;
            const view = block.querySelector('.view');
            const tag = block.dataset.type === 'h1' ? 'h1' : (block.dataset.type === 'h2' ? 'h2' : 'p');
            view.innerHTML = `<${tag}>${txt}</${tag}>`;
            block.querySelector('.edit-zone').style.display = 'none';
            view.style.display = 'block';
            checkOverflow();
        }

        function handleImages(input) {
            const grid = input.parentElement.nextElementSibling;
            const files = Array.from(input.files);
            // Ta logique de colonnes
            let cols = files.length === 1 ? 1 : (files.length === 2 || files.length === 4 ? 2 : 3);
            grid.style.setProperty('--cols', cols);

            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = document.createElement('img');
                    img.src = e.target.result;
                    grid.appendChild(img);
                };
                reader.readAsDataURL(file);
            });
            input.parentElement.style.display = 'none';
            setTimeout(checkOverflow, 500);
        }

        function checkOverflow() {
            const page = document.getElementById(`page-${currentPage}`);
            // Si le contenu dépasse la hauteur de la page A4 (297mm)
            if (page.scrollHeight > page.clientHeight) {
                currentPage++;
                const newPage = document.createElement('div');
                newPage.className = 'page';
                newPage.id = `page-${currentPage}`;
                document.getElementById('container').appendChild(newPage);
                
                // On déplace le dernier bloc qui dépasse sur la nouvelle page
                const lastBlock = page.lastElementChild;
                newPage.appendChild(lastBlock);
            }
        }

        function edit(view) {
            view.style.display = 'none';
            view.previousElementSibling.style.display = 'block';
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rapport Expert v6 - Photos Inclues</title>
    <style>
        :root { --p-width: 210mm; --p-height: 297mm; }
        body { background: #1a1a1a; margin: 0; padding-top: 60px; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; }
        
        .toolbar { position: fixed; top: 0; width: 100%; background: #000; padding: 10px; display: flex; justify-content: center; gap: 10px; z-index: 2000; }
        .toolbar button { padding: 12px; border-radius: 8px; border: none; cursor: pointer; background: #fff; font-weight: bold; }

        #paper { 
            width: var(--p-width); min-height: var(--p-height); 
            background: white; padding: 15mm; box-sizing: border-box; 
            box-shadow: 0 0 30px rgba(0,0,0,0.7); margin-bottom: 150px;
            position: relative;
        }

        .block { position: relative; margin-bottom: 10px; border: 1px solid transparent; cursor: pointer; }
        .block.active { border: 2px solid #3498db; background: #f0f8ff; }
        
        /* ZONES ÉDITION */
        .edit-zone { display: flex; flex-direction: column; gap: 10px; background: #f4f4f4; padding: 15px; border-radius: 8px; }
        textarea { width: 100%; border: 1px solid #ccc; padding: 12px; border-radius: 6px; font-size: 16px; box-sizing: border-box; min-height: 80px; }
        .btn-valid { background: #27ae60; color: white; border: none; padding: 15px; border-radius: 8px; cursor: pointer; font-weight: bold; }

        /* GRILLE PHOTOS */
        .img-grid { 
            display: grid; gap: 5px; width: 100%; overflow: hidden;
            grid-template-columns: repeat(var(--cols, 1), 1fr);
        }
        .img-grid img { width: 100%; height: 100%; object-fit: cover; border-radius: 2px; }

        /* PANNEAU DE CONTRÔLES */
        .controls-panel { 
            display: none; position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: #3498db; padding: 15px; border-radius: 12px; 
            box-shadow: 0 5px 25px rgba(0,0,0,0.5); z-index: 3000;
            flex-direction: column; gap: 12px; width: 90%; max-width: 400px;
        }
        .block.active .controls-panel { display: flex; }
        
        .control-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        .control-row label { color: white; font-weight: bold; font-size: 13px; flex: 1; text-transform: uppercase; }
        
        .ctrl-btn { width: 50px; height: 50px; background: white; color: #3498db; border: none; border-radius: 10px; font-size: 24px; font-weight: bold; cursor: pointer; }
        .btn-action { padding: 10px; border-radius: 8px; border: none; font-weight: bold; height: 50px; cursor: pointer; }
        .btn-blue { background: #2980b9; color: white; }
        .btn-green { background: #2ecc71; color: white; flex: 1; }
        .btn-red { background: #e74c3c; color: white; }

        /* STYLES TEXTE */
        h1 { margin: 0; font-size: 24pt; text-transform: uppercase; border-bottom: 2px solid black; padding-bottom: 5px; }
        h2 { margin: 0; font-size: 18pt; font-weight: bold; }
        p { margin: 0; font-size: 12pt; white-space: pre-wrap; line-height: 1.5; }

        @media print {
            .toolbar, .controls-panel, .edit-zone { display: none !important; }
            .block.active { border: none !important; background: none !important; }
            #paper { box-shadow: none; margin: 0; width: 100%; padding: 15mm; }
        }

        @media screen and (max-width: 210mm) {
            #paper { transform: scale(calc(100vw / 225mm)); transform-origin: top center; }
        }
    </style>
</head>
<body onclick="closeAll()">

<div class="toolbar">
    <button onclick="addBlock('h1')">H1</button>
    <button onclick="addBlock('h2')">H2</button>
    <button onclick="addBlock('p')">TEXTE</button>
    <button onclick="addBlock('img')">PHOTOS</button>
    <button style="background:#27ae60; color:white" onclick="window.print()">PDF</button>
</div>

<div id="paper"></div>

<script>
    function addBlock(type) {
        const paper = document.getElementById('paper');
        const div = document.createElement('div');
        div.className = 'block';
        div.dataset.type = type;
        div.dataset.marginBottom = "10"; 
        
        // Initialisation spécifique selon le type
        if(type === 'img') {
            div.dataset.height = "60"; // Hauteur initiale des photos en mm
        } else {
            div.dataset.fontSize = ""; 
        }

        div.onclick = function(e) { e.stopPropagation(); selectBlock(this); };

        let contentHtml = "";
        if(type === 'img') {
            contentHtml = `
                <div class="edit-zone">
                    <input type="file" multiple accept="image/*" onchange="handleFiles(this)">
                    <p style="font-size:10px; color:#666">Sélectionnez une ou plusieurs photos</p>
                </div>
                <div class="view-zone img-grid" style="display:none;"></div>
            `;
        } else {
            contentHtml = `
                <div class="edit-zone">
                    <textarea placeholder="Saisir ${type}..."></textarea>
                    <button class="btn-valid" onclick="validateText(event, this)">VALIDER LE CONTENU</button>
                </div>
                <div class="view-zone" style="display:none;"></div>
            `;
        }

        div.innerHTML = contentHtml + `
            <div class="controls-panel">
                <div class="control-row">
                    <label>${type === 'img' ? 'Hauteur Photo' : 'Taille Texte'}</label>
                    <button class="ctrl-btn" onclick="changeSize(event, this, ${type === 'img' ? -10 : -2})">-</button>
                    <button class="ctrl-btn" onclick="changeSize(event, this, ${type === 'img' ? 10 : 2})">+</button>
                </div>
                <div class="control-row">
                    <label>Espace Bas</label>
                    <button class="ctrl-btn" onclick="changeMargin(event, this, -5)">-</button>
                    <button class="ctrl-btn" onclick="changeMargin(event, this, 5)">+</button>
                </div>
                <div class="control-row">
                    ${type !== 'img' ? '<button class="btn-action btn-blue" onclick="reEdit(event, this)">MODIFIER</button>' : ''}
                    <button class="btn-action btn-green" onclick="event.stopPropagation(); closeAll();">TERMINER</button>
                    <button class="btn-action btn-red" onclick="this.closest('.block').remove()">✕</button>
                </div>
            </div>
        `;
        paper.appendChild(div);
    }

    function handleFiles(input) {
        const block = input.closest('.block');
        const view = block.querySelector('.view-zone');
        const files = Array.from(input.files);
        if(!files.length) return;

        view.innerHTML = "";
        let cols = files.length === 1 ? 1 : (files.length === 2 || files.length === 4 ? 2 : 3);
        view.style.setProperty('--cols', cols);

        files.forEach(file => {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = document.createElement('img');
                img.src = e.target.result;
                view.appendChild(img);
            };
            reader.readAsDataURL(file);
        });

        // Appliquer hauteur mémorisée
        view.style.height = block.dataset.height + "mm";
        block.style.marginBottom = block.dataset.marginBottom + "px";

        block.querySelector('.edit-zone').style.display = 'none';
        view.style.display = 'grid';
        closeAll();
    }

    function validateText(e, btn) {
        e.stopPropagation();
        const block = btn.closest('.block');
        const txt = block.querySelector('textarea').value;
        const view = block.querySelector('.view-zone');
        const tag = block.dataset.type === 'h1' ? 'h1' : (block.dataset.type === 'h2' ? 'h2' : 'p');
        
        view.innerHTML = `<${tag}>${txt}</${tag}>`;
        if(block.dataset.fontSize) view.firstElementChild.style.fontSize = block.dataset.fontSize;
        block.style.marginBottom = block.dataset.marginBottom + "px";

        block.querySelector('.edit-zone').style.display = 'none';
        view.style.display = 'block';
        closeAll();
    }

    function changeSize(e, btn, delta) {
        e.stopPropagation();
        const block = btn.closest('.block');
        const view = block.querySelector('.view-zone');
        
        if (block.dataset.type === 'img') {
            let newH = Math.max(10, parseFloat(block.dataset.height) + delta);
            view.style.height = newH + "mm";
            block.dataset.height = newH;
        } else {
            const element = view.firstElementChild;
            if (!element) return;
            const currentSize = window.getComputedStyle(element).fontSize;
            const newSize = (parseFloat(currentSize) + delta) + 'px';
            element.style.fontSize = newSize;
            block.dataset.fontSize = newSize;
        }
    }

    function changeMargin(e, btn, delta) {
        e.stopPropagation();
        const block = btn.closest('.block');
        const newMargin = Math.max(0, parseFloat(block.dataset.marginBottom) + delta);
        block.style.marginBottom = newMargin + "px";
        block.dataset.marginBottom = newMargin;
    }

    function selectBlock(el) {
        if (el.querySelector('.view-zone').style.display === 'none') return;
        closeAll();
        el.classList.add('active');
    }

    function closeAll() {
        document.querySelectorAll('.block').forEach(b => b.classList.remove('active'));
    }

    function reEdit(e, btn) {
        e.stopPropagation();
        const block = btn.closest('.block');
        block.querySelector('.view-zone').style.display = 'none';
        block.querySelector('.edit-zone').style.display = 'flex';
        closeAll();
    }
</script>
</body>
</html>

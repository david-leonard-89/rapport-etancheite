<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <title>Expert Rapporteur</title>
    <style>
        :root { --p-width: 210mm; --p-height: 297mm; --blue: #3498db; --dark: #2c3e50; }
        
        body { 
            background: #1a1a1a; margin: 0; padding-top: 70px; 
            font-family: sans-serif; display: flex; flex-direction: column; align-items: center;
        }

        /* TOOLBAR HAUT */
        .toolbar { 
            position: fixed; top: 0; width: 100%; background: #000; 
            padding: 10px; display: flex; justify-content: center; gap: 8px; z-index: 2000; 
        }
        .toolbar button { 
            flex: 1; max-width: 70px; height: 50px; border-radius: 8px; border: none; 
            font-weight: bold; cursor: pointer; background: #eee;
        }

        /* ZONE PAPIER */
        #viewport { width: 100%; display: flex; justify-content: center; padding-bottom: 250px; }
        #paper-container { 
            width: var(--p-width); background: white; position: relative;
            box-shadow: 0 0 30px rgba(0,0,0,0.7);
            zoom: 0.46; 
        }
        #paper { width: 100%; padding: 15mm; box-sizing: border-box; min-height: var(--p-height); display: flex; flex-direction: column; }

        /* LIGNE A4 */
        .page-break-line {
            position: absolute; left: 0; width: 100%; height: 2px;
            background: rgba(255, 0, 0, 0.2); border-top: 2px dashed red;
            pointer-events: none; z-index: 500; display: flex; justify-content: center;
        }
        .page-break-line::after {
            content: "LIMITE PAGE A4"; background: red; color: white; font-size: 12px; 
            padding: 4px 10px; border-radius: 0 0 8px 8px; height: 16px; font-weight: bold;
        }

        /* BLOCS */
        .block { position: relative; margin-bottom: 10px; border: 2px solid transparent; transition: 0.2s; }
        .block.active { border: 4px solid var(--blue); background: #f0f8ff; }
        
        .edit-zone { display: flex; flex-direction: column; gap: 15px; background: #f4f4f4; padding: 20px; border-radius: 10px; }
        textarea { width: 100%; border: 1px solid #ccc; padding: 15px; font-size: 20px; border-radius: 8px; box-sizing: border-box; }
        
        .img-grid { display: grid; gap: 8px; width: 100%; grid-template-columns: repeat(var(--cols, 1), 1fr); }
        .img-grid img { width: 100%; height: 100%; object-fit: cover; border: 1px solid #ddd; }

        /* CONTROLES BAS */
        .controls-panel { 
            display: none; position: fixed; bottom: 0; left: 0; width: 100%;
            background: var(--dark); border-top: 4px solid var(--blue);
            z-index: 3000; padding: 15px; box-sizing: border-box; flex-direction: column; gap: 10px;
        }
        .active-block-exists .controls-panel { display: flex; }
        .control-row { display: flex; width: 100%; gap: 10px; }
        .btn-group { display: flex; flex: 1; align-items: center; background: #34495e; border-radius: 10px; overflow: hidden; height: 55px; }
        .btn-group label { color: white; font-size: 10px; flex: 1; text-align: center; font-weight: bold; }
        .ctrl-btn { width: 50px; height: 100%; background: white; border: none; font-size: 20px; font-weight: bold; color: var(--blue); }
        .btn-action { height: 55px; border-radius: 10px; border: none; font-weight: bold; color: white; flex: 1; }

        h1 { margin: 0; font-size: 28pt; line-height: 1.2; }
        h2 { margin: 0; font-size: 20pt; line-height: 1.2; }
        p { margin: 0; font-size: 12pt; line-height: 1.4; white-space: pre-wrap; }

        @media print {
            .toolbar, .controls-panel, .page-break-line, .edit-zone { display: none !important; }
            #paper-container { zoom: 1 !important; width: 210mm; }
        }
    </style>
</head>
<body onclick="closeAll()">

<div class="toolbar">
    <button onclick="addBlock('h1')"><b style="font-size:18px">Aa</b></button>
    <button onclick="addBlock('h2')"><b style="font-size:14px">Aa</b></button>
    <button onclick="addBlock('p')">txt</button>
    <button onclick="addBlock('img')">IMG</button>
    <button style="background:#27ae60; color:white" onclick="window.print()">PDF</button>
</div>

<div id="viewport">
    <div id="paper-container">
        <div id="paper"></div>
        <div class="page-break-line" style="top: 297mm;"></div>
        <div class="page-break-line" style="top: 594mm;"></div>
    </div>
</div>

<div id="master-controls" class="controls-panel" onclick="event.stopPropagation()">
    <div class="control-row">
        <div class="btn-group">
            <button class="ctrl-btn" onclick="triggerSize(-1)">-</button>
            <label id="label-size">TAILLE</label>
            <button class="ctrl-btn" onclick="triggerSize(1)">+</button>
        </div>
        <div class="btn-group">
            <button class="ctrl-btn" onclick="triggerWidth(-10)">-</button>
            <label>LARG.</label>
            <button class="ctrl-btn" onclick="triggerWidth(10)">+</button>
        </div>
    </div>
    <div class="control-row">
        <div class="btn-group">
            <button class="ctrl-btn" onclick="triggerMargin(-5)">-</button>
            <label>ESPACE</label>
            <button class="ctrl-btn" onclick="triggerMargin(5)">+</button>
        </div>
        <button class="btn-action" style="background:#f39c12" onclick="triggerAlign()">ALIGNER</button>
    </div>
    <div class="control-row">
        <button class="btn-action" style="background:#2ecc71; flex:2" onclick="closeAll()">TERMINER</button>
        <button class="btn-action" style="background:#e74c3c; flex:0.5" onclick="triggerDelete()">✕</button>
    </div>
</div>

<script>
    let activeBlock = null;

    function addBlock(type) {
        const paper = document.getElementById('paper');
        const div = document.createElement('div');
        div.className = 'block';
        div.dataset.type = type;
        div.dataset.marginBottom = "10"; 
        div.dataset.widthPercent = "100";
        div.dataset.align = "left";
        div.dataset.fontSize = type === 'h1' ? "28" : (type === 'h2' ? "20" : "12");
        if(type === 'img') div.dataset.height = "80";

        div.onclick = function(e) { e.stopPropagation(); selectBlock(this); };

        div.innerHTML = type === 'img' ? 
            `<div class="edit-zone"><input type="file" multiple accept="image/*" onchange="handleFiles(this)"></div>
             <div class="view-zone img-grid" style="display:none;"></div>` :
            `<div class="edit-zone"><textarea placeholder="Texte..."></textarea>
             <button class="btn-action" style="background:#2ecc71" onclick="validateText(event, this)">OK</button></div>
             <div class="view-zone" style="display:none;"></div>`;

        paper.appendChild(div);
    }

    function handleFiles(input) {
        const block = input.closest('.block');
        const view = block.querySelector('.view-zone');
        const files = Array.from(input.files);
        if(!files.length) return;
        view.innerHTML = "";
        block.style.setProperty('--cols', files.length > 1 ? (files.length === 2 || files.length === 4 ? 2 : 3) : 1);
        files.forEach(file => {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = document.createElement('img');
                img.src = e.target.result;
                view.appendChild(img);
                applyStyles(block);
            };
            reader.readAsDataURL(file);
        });
        block.querySelector('.edit-zone').style.display = 'none';
        view.style.display = 'grid';
        selectBlock(block);
    }

    function validateText(e, btn) {
        e.stopPropagation();
        const block = btn.closest('.block');
        const txt = block.querySelector('textarea').value;
        const view = block.querySelector('.view-zone');
        const tag = block.dataset.type === 'h1' ? 'h1' : (block.dataset.type === 'h2' ? 'h2' : 'p');
        view.innerHTML = `<${tag}>${txt}</${tag}>`;
        block.querySelector('.edit-zone').style.display = 'none';
        view.style.display = 'block';
        applyStyles(block);
        selectBlock(block);
    }

    function applyStyles(block) {
        block.style.width = block.dataset.widthPercent + "%";
        block.style.marginBottom = block.dataset.marginBottom + "px";
        block.style.textAlign = block.dataset.align;
        
        const align = block.dataset.align;
        block.style.marginLeft = (align === 'right' || align === 'center') ? 'auto' : '0';
        block.style.marginRight = (align === 'left' || align === 'center') ? 'auto' : '0';

        if(block.dataset.type === 'img') {
            block.querySelectorAll('.img-grid img').forEach(img => img.style.height = block.dataset.height + "mm");
        } else {
            const el = block.querySelector('.view-zone').firstElementChild;
            if(el) el.style.fontSize = block.dataset.fontSize + "pt";
        }
    }

    function selectBlock(el) {
        if (el.querySelector('.view-zone').style.display === 'none') return;
        closeAll();
        activeBlock = el;
        el.classList.add('active');
        document.body.classList.add('active-block-exists');
        document.getElementById('label-size').innerText = el.dataset.type === 'img' ? 'PHOTO' : 'TAILLE';
    }

    function closeAll() {
        document.querySelectorAll('.block').forEach(b => b.classList.remove('active'));
        document.body.classList.remove('active-block-exists');
        activeBlock = null;
    }

    function triggerSize(delta) {
        if(!activeBlock) return;
        if (activeBlock.dataset.type === 'img') activeBlock.dataset.height = Math.max(10, parseFloat(activeBlock.dataset.height) + (delta * 10));
        else activeBlock.dataset.fontSize = Math.max(8, parseFloat(activeBlock.dataset.fontSize) + (delta * 2));
        applyStyles(activeBlock);
    }

    function triggerWidth(delta) {
        if(!activeBlock) return;
        activeBlock.dataset.widthPercent = Math.min(100, Math.max(10, parseFloat(activeBlock.dataset.widthPercent) + delta));
        applyStyles(activeBlock);
    }

    function triggerMargin(delta) {
        if(!activeBlock) return;
        activeBlock.dataset.marginBottom = Math.max(0, parseFloat(activeBlock.dataset.marginBottom) + delta);
        applyStyles(activeBlock);
    }

    function triggerAlign() {
        if(!activeBlock) return;
        const states = ['left', 'center', 'right'];
        activeBlock.dataset.align = states[(states.indexOf(activeBlock.dataset.align) + 1) % 3];
        applyStyles(activeBlock);
    }

    function triggerDelete() {
        if(activeBlock && confirm('Supprimer ce bloc ?')) { activeBlock.remove(); closeAll(); }
    }
</script>
</body>
</html>

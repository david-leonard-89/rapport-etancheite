<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Générateur de Rapport</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body { font-family: sans-serif; padding-top: 80px; }
        .toolbar { position: fixed; top: 0; width: 100%; background: #f8f9fa; padding: 10px; display: flex; gap: 5px; z-index: 1000; border-bottom: 1px solid #ccc; }
        .block { border: 1px solid #ddd; padding: 10px; margin-bottom: 10px; position: relative; background: white; }
        .del-btn { position: absolute; top: 5px; right: 5px; color: red; cursor: pointer; font-weight: bold; }
        .view-mode { font-size: 1.2em; white-space: pre-wrap; }
        .edit-mode { display: block; width: 90%; }
        button { padding: 10px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="toolbar">
        <button onclick="addBlock('h1')">Titre</button>
        <button onclick="addBlock('h2')">S-Titre</button>
        <button onclick="addBlock('p')">Texte</button>
        <button onclick="addBlock('img')">Photo</button>
    </div>

    <div id="content-area"></div>
    <div style="padding: 20px;"><button onclick="generatePDF()" style="background: green; color: white;">Générer PDF Final</button></div>

    <script>
        function addBlock(type) {
            const div = document.createElement('div');
            div.className = 'block';
            div.dataset.type = type;
            div.innerHTML = `<span class="del-btn" onclick="this.parentElement.remove()">X</span>`;
            
            if (type === 'img') {
                div.innerHTML += `<input type="file" accept="image/*" multiple onchange="handleImages(this)">`;
            } else {
                div.innerHTML += `<div class="edit-mode"><textarea placeholder="Saisir ${type}..."></textarea><button onclick="validate(this)">Valider</button></div><div class="view-mode" style="display:none;"></div>`;
            }
            document.getElementById('content-area').appendChild(div);
        }

        function validate(btn) {
            const block = btn.parentElement.parentElement;
            const text = btn.previousElementSibling.value;
            block.querySelector('.view-mode').innerText = text;
            block.querySelector('.view-mode').style.display = 'block';
            block.querySelector('.edit-mode').style.display = 'none';
        }

        function handleImages(input) {
            Array.from(input.files).forEach(file => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = document.createElement('img');
                    img.src = e.target.result;
                    img.style.maxWidth = "100%";
                    input.parentElement.appendChild(img);
                };
                reader.readAsDataURL(file);
            });
            input.style.display = 'none'; // Cache l'input après choix
        }

        async function generatePDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            let y = 20;

            document.querySelectorAll('.block').forEach(block => {
                const type = block.dataset.type;
                if (type === 'h1' || type === 'h2' || type === 'p') {
                    const text = block.querySelector('.view-mode').innerText;
                    doc.setFontSize(type === 'h1' ? 22 : type === 'h2' ? 16 : 12);
                    const lines = doc.splitTextToSize(text, 180);
                    doc.text(lines, 10, y);
                    y += (lines.length * 8) + 10;
                } else if (type === 'img') {
                    block.querySelectorAll('img').forEach(img => {
                        const ratio = img.naturalWidth / img.naturalHeight;
                        const w = 100;
                        const h = 100 / ratio;
                        if (y + h > 280) { doc.addPage(); y = 20; }
                        doc.addImage(img.src, 'JPEG', 10, y, w, h);
                        y += h + 10;
                    });
                }
            });
            doc.save("rapport.pdf");
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <title>Expert Rapporteur</title>
    <style>
        * {
    -webkit-print-color-adjust: exact !important; /* Pour Chrome/Safari */
    print-color-adjust: exact !important;         /* Standard */
        }
        
        :root { 
            --p-width: 210mm; --p-height: 297mm; --blue: #3498db; --dark: #2c3e50; 
            --galien-orange: #ff8f00;
        }
        body { background: #1a1a1a; margin: 0; padding-top: 70px; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; }

        /* TOOLBAR HAUT */
        .toolbar { position: fixed; top: 0; width: 100%; background: #000; padding: 10px; display: flex; justify-content: center; gap: 8px; z-index: 2000; }
        .toolbar button { flex: 1; max-width: 70px; height: 50px; border-radius: 8px; border: none; font-weight: bold; background: #eee; }

        /* ZONE PAPIER */
        #viewport { width: 100%; display: flex; justify-content: center; padding-bottom: 280px; }
        #paper-container { 
            width: var(--p-width); background: white; position: relative;
            box-shadow: 0 0 30px rgba(0,0,0,0.7);
            zoom: 0.46; min-height: var(--p-height); overflow: hidden;
        }
        #paper { width: 100%; padding: 15mm; box-sizing: border-box; z-index: 2; position: relative; display: flex; flex-direction: column; min-height: 297mm; }

        /* HEADER DESIGN (VAGUE ORANGE/NOIR) */
        .pdf-header { 
            display: none; position: absolute; top: -15mm; left: -10%; width: 120%; height: 80mm; 
            background: linear-gradient(100deg, var(--galien-orange) 35%, #000000 85%); 
            transform: rotate(-3deg); border-bottom-left-radius: 40% 20%; border-bottom-right-radius: 60% 40%; z-index: 1; 
        }
        .logo-wrap { display: none; position: absolute; top: 15mm; right: 15mm; z-index: 10; }
        .logo-wrap img { max-height: 35mm; background: white; padding: 10px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }

        .pdf-footer { 
            display: none; position: fixed; bottom: 0; width: 100%; padding: 15px 0; 
            text-align: center; font-size: 10pt; color: #444; border-top: 3px solid var(--galien-orange); 
            background: white; line-height: 1.5; z-index: 100;
        }

        /* LIGNES A4 DYNAMIQUES */
        .page-break-line { position: absolute; left: 0; width: 100%; height: 2px; background: rgba(255,0,0,0.2); border-top: 2px dashed red; z-index: 500; display: none; justify-content: center; }
        .page-break-line::after { content: "LIMITE PAGE"; background: red; color: white; font-size: 10px; padding: 2px 8px; border-radius: 0 0 5px 5px; font-weight: bold; }

        /* BLOCS */
        .block { position: relative; margin-bottom: 10px; border: 2px solid transparent; }
        .block.active { border: 4px solid var(--blue); background: #f0f8ff; }
        .edit-zone { display: flex; flex-direction: column; gap: 15px; background: #f4f4f4; padding: 20px; border-radius: 10px; }
        textarea { width: 100%; border: 1px solid #ccc; padding: 15px; font-size: 20px; border-radius: 8px; box-sizing: border-box; }
        
        .img-grid { display: grid; gap: 8px; width: 100%; grid-template-columns: repeat(var(--cols, 1), 1fr); position: relative; }
        .img-grid img { width: 100%; height: 100%; object-fit: cover; border: 1px solid #ddd; }
        .img-caption { position: absolute; bottom: 5px; left: 5px; background: rgba(0,0,0,0.8); color: white; padding: 4px 10px; font-size: 14px; border-radius: 4px; pointer-events: none; }

        /* TOOLBAR BAS (TAILLES ÉGALES) */
        .controls-panel { display: none; position: fixed; bottom: 0; left: 0; width: 100%; background: var(--dark); border-top: 4px solid var(--blue); z-index: 3000; padding: 15px; flex-direction: column; gap: 10px; box-sizing: border-box; }
        .active-block-exists .controls-panel { display: flex; }
        .control-row { display: flex; width: 100%; gap: 10px; }
        .btn-group { display: flex; flex: 1; align-items: center; background: #34495e; border-radius: 10px; overflow: hidden; height: 60px; }
        .btn-group label { color: white; font-size: 10px; flex: 1; text-align: center; font-weight: bold; }
        .ctrl-btn { width: 60px; height: 100%; background: white; border: none; font-size: 20px; font-weight: bold; color: var(--blue); }
        .btn-action { height: 60px; border-radius: 10px; border: none; font-weight: bold; color: white; flex: 1; font-size: 11px; text-transform: uppercase; }

        h1, h2, p { margin: 0; line-height: 1.2; }
        h1 { font-size: 28pt; } h2 { font-size: 20pt; } p { font-size: 12pt; white-space: pre-wrap; line-height: 1.4; }

        @media print {
            .toolbar, .controls-panel, .page-break-line, .edit-zone { display: none !important; }
            #paper-container { zoom: 1 !important; width: 210mm; box-shadow: none; position: relative; }
            .pdf-header, .logo-wrap, .pdf-footer { display: block; }
            .logo-wrap { display: flex; }
            #paper { padding-top: 85mm !important; }
        }
    </style>
</head>
<body onclick="closeAll()">

<div class="toolbar">
    <button onclick="addBlock('h1')"><b style="font-size:18px">Aa</b></button>
    <button onclick="addBlock('h2')"><b style="font-size:14px">Aa</b></button>
    <button onclick="addBlock('p')">TEXTE</button>
    <button onclick="document.getElementById('hidden-file').click()">IMG</button>
    <button style="background:#27ae60; color:white" onclick="window.print()">PDF</button>
</div>

<input type="file" id="hidden-file" multiple accept="image/*" style="display:none" onchange="handleFiles(this)">

<div id="viewport">
    <div id="paper-container">
        <div class="pdf-header"></div>
        <div class="logo-wrap">
            <img src="Screenshot_2026-05-06-08-39-13-447_com.android.chrome-edit.jpg" alt="Logo">
        </div>
        <div id="paper"></div>
        <div class="pdf-footer">
            <b style="color:var(--galien-orange)">Galien Toiture</b> - 1 rue Jacques Monod, 69680 Chassieu<br>
            Mail : contact.galientoiture@gmail.com | Tel : 04 78 23 89 29
        </div>
        <div id="break-1" class="page-break-line" style="top: 297mm;"></div>
        <div id="break-2" class="page-break-line" style="top: 594mm;"></div>
    </div>
</div>

<div id="master-controls" class="controls-panel" onclick="event.stopPropagation()">
    <div class="control-row">
        <div class="btn-group">
            <button class="ctrl-btn" onclick="triggerSize(-1)">-</button>
            <label>TAILLE</label>
            <button class="ctrl-btn" onclick="triggerSize(1)">+</button>
        </div>
        <div class="btn-group">
            <button class="ctrl-btn" onclick="triggerWidth(-10)">-</button>
            <label>LARG.</label>
            <button class="ctrl-btn" onclick="triggerWidth(10)">+</button>
        </div>
    </div>
    <div class="control-row">
        <div class="btn-group">
            <button class="ctrl-btn" onclick="triggerMargin(-5)">-</button>
            <label>ESPACE</label>
            <button class="ctrl-btn" onclick="triggerMargin(5)">+</button>
        </div>
        <button class="btn-action" style="background:#f39c12" onclick="triggerAlign()">ALIGNER</button>
    </div>
    <div class="control-row">
        <button id="btn-note" class="btn-action" style="background:#9b59b6" onclick="triggerNote()">ANNOTER</button>
        <button class="btn-action" style="background:#2ecc71" onclick="closeAll()">TERMINER</button>
        <button class="btn-action" style="background:#e74c3c" onclick="triggerDelete()">SUPPR</button>
    </div>
</div>

<script>
    let activeBlock = null;

    function addBlock(type) {
        const paper = document.getElementById('paper');
        const div = document.createElement('div');
        div.className = 'block';
        div.dataset.type = type;
        div.dataset.marginBottom = "10"; 
        div.dataset.widthPercent = "100";
        div.dataset.align = "left";
        div.dataset.fontSize = type === 'h1' ? "28" : (type === 'h2' ? "20" : "12");

        div.onclick = function(e) { e.stopPropagation(); selectBlock(this); };

        const isTitle = (type === 'h1' || type === 'h2');
        div.innerHTML = `<div class="edit-zone">
            <textarea placeholder="Saisir..." onkeydown="${isTitle ? "if(event.key==='Enter'){event.preventDefault(); validateText(event, this)}" : ''}"></textarea>
            ${type === 'p' ? '<button class="btn-action" style="background:#2ecc71" onclick="validateText(event, this)">VALIDER</button>' : ''}
        </div><div class="view-zone" style="display:none;"></div>`;

        paper.appendChild(div);
        checkPages();
    }

    function handleFiles(input) {
        const paper = document.getElementById('paper');
        const files = Array.from(input.files);
        if(!files.length) return;
        const div = document.createElement('div');
        div.className = 'block';
        div.dataset.type = 'img';
        div.dataset.height = "80";
        div.dataset.widthPercent = "100";
        div.dataset.marginBottom = "15";
        div.onclick = function(e) { e.stopPropagation(); selectBlock(this); };
        const grid = document.createElement('div');
        grid.className = 'view-zone img-grid';
        grid.style.setProperty('--cols', files.length > 1 ? (files.length === 2 || files.length === 4 ? 2 : 3) : 1);
        files.forEach(file => {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = document.createElement('img');
                img.src = e.target.result;
                grid.appendChild(img);
                applyStyles(div);
            };
            reader.readAsDataURL(file);
        });
        div.appendChild(grid);
        paper.appendChild(div);
        input.value = ""; 
        checkPages();
    }

    function validateText(e, target) {
        const block = target.closest('.block');
        const txt = block.querySelector('textarea').value;
        const view = block.querySelector('.view-zone');
        const tag = block.dataset.type === 'h1' ? 'h1' : (block.dataset.type === 'h2' ? 'h2' : 'p');
        view.innerHTML = `<${tag}>${txt}</${tag}>`;
        block.querySelector('.edit-zone').style.display = 'none';
        view.style.display = 'block';
        applyStyles(block);
        selectBlock(block);
        checkPages();
    }

    function triggerNote() {
        if(!activeBlock || activeBlock.dataset.type !== 'img') return;
        const note = prompt("Remarque sur la photo :");
        if(note) {
            let caption = activeBlock.querySelector('.img-caption');
            if(!caption) {
                caption = document.createElement('div');
                caption.className = 'img-caption';
                activeBlock.querySelector('.img-grid').appendChild(caption);
            }
            caption.innerText = note;
        }
    }

    function applyStyles(block) {
        block.style.width = block.dataset.widthPercent + "%";
        block.style.marginBottom = block.dataset.marginBottom + "px";
        block.style.textAlign = block.dataset.align;
        const align = block.dataset.align;
        block.style.marginLeft = (align === 'right' || align === 'center') ? 'auto' : '0';
        block.style.marginRight = (align === 'left' || align === 'center') ? 'auto' : '0';
        if(block.dataset.type === 'img') {
            block.querySelectorAll('.img-grid img').forEach(img => img.style.height = block.dataset.height + "mm");
        } else {
            const el = block.querySelector('.view-zone').firstElementChild;
            if(el) el.style.fontSize = block.dataset.fontSize + "pt";
        }
        checkPages();
    }

    function checkPages() {
        const paper = document.getElementById('paper');
        const break1 = document.getElementById('break-1');
        const break2 = document.getElementById('break-2');
        const pxToMm = 0.264583;
        const h = paper.scrollHeight * pxToMm;
        // On ne montre les lignes que si le contenu dépasse réellement une page
        break1.style.display = h > 297 ? 'flex' : 'none';
        break2.style.display = h > 594 ? 'flex' : 'none';
    }

    function selectBlock(el) {
        if (el.querySelector('.view-zone').style.display === 'none') return;
        closeAll();
        activeBlock = el;
        el.classList.add('active');
        document.body.classList.add('active-block-exists');
        document.getElementById('btn-note').style.opacity = el.dataset.type === 'img' ? '1' : '0.3';
    }

    function closeAll() {
        document.querySelectorAll('.block').forEach(b => b.classList.remove('active'));
        document.body.classList.remove('active-block-exists');
        activeBlock = null;
    }

    function triggerSize(delta) {
        if(!activeBlock) return;
        if (activeBlock.dataset.type === 'img') activeBlock.dataset.height = Math.max(10, parseFloat(activeBlock.dataset.height) + (delta * 10));
        else activeBlock.dataset.fontSize = Math.max(8, parseFloat(activeBlock.dataset.fontSize) + (delta * 2));
        applyStyles(activeBlock);
    }

    function triggerWidth(delta) {
        if(!activeBlock) return;
        activeBlock.dataset.widthPercent = Math.min(100, Math.max(10, parseFloat(activeBlock.dataset.widthPercent) + delta));
        applyStyles(activeBlock);
    }

    function triggerMargin(delta) {
        if(!activeBlock) return;
        activeBlock.dataset.marginBottom = Math.max(0, parseFloat(activeBlock.dataset.marginBottom) + delta);
        applyStyles(activeBlock);
    }

    function triggerAlign() {
        if(!activeBlock) return;
        const states = ['left', 'center', 'right'];
        activeBlock.dataset.align = states[(states.indexOf(activeBlock.dataset.align) + 1) % 3];
        applyStyles(activeBlock);
    }

    function triggerDelete() {
        if(activeBlock && confirm('Supprimer ce bloc ?')) { activeBlock.remove(); closeAll(); checkPages(); }
    }
</script>
</body>
</html>

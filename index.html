<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Rapport Étanchéité</title>
    <style>
        /* --- STYLE INTERFACE (ÉCRAN UNIQUEMENT) --- */
        @media screen {
            body { background: #e0e0e0; margin: 0; padding-top: 60px; font-family: 'Segoe UI', sans-serif; }
            .toolbar { position: fixed; top: 0; width: 100%; background: #2c3e50; padding: 10px; display: flex; justify-content: center; gap: 10px; z-index: 1000; }
            .toolbar button { padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; background: #ecf0f1; }
            .btn-pdf { background: #27ae60 !important; color: white; }
            
            /* La "feuille" A4 sur l'écran */
            #paper { 
                width: 210mm; 
                min-height: 297mm; 
                padding: 15mm; 
                margin: 10px auto; 
                background: white; 
                box-shadow: 0 0 10px rgba(0,0,0,0.3);
                box-sizing: border-box;
            }
            .del-btn { color: red; cursor: pointer; font-size: 12px; float: right; border: 1px solid red; padding: 2px 5px; border-radius: 3px; }
        }

        /* --- STYLE DU RAPPORT (ÉCRAN + PDF) --- */
        #paper { font-family: Arial, sans-serif; color: #000; line-height: 1.4; }
        
        .block { margin-bottom: 15px; clear: both; position: relative; }
        
        h1 { font-size: 22pt; text-transform: uppercase; margin: 10px 0; border-bottom: 2px solid #000; }
        h2 { font-size: 16pt; text-transform: uppercase; margin: 8px 0; color: #333; }
        p { font-size: 11pt; margin: 5px 0; white-space: pre-wrap; }

        /* Grille Photo Intelligente */
        .img-grid { 
            display: grid; 
            gap: 8px; 
            margin-top: 10px;
            grid-template-columns: repeat(var(--cols, 1), 1fr);
        }
        .img-grid img { width: 100%; height: auto; border-radius: 2px; display: block; }

        /* Gestion des sauts de page PDF */
        @media print {
            .toolbar, .del-btn, input[type="file"], .btn-validate { display: none !important; }
            body { background: white; padding: 0; margin: 0; }
            #paper { width: 100%; margin: 0; padding: 10mm; box-shadow: none; }
            .block { page-break-inside: avoid; } /* Évite de couper une photo en deux */
        }
    </style>
</head>
<body>

    <div class="toolbar">
        <button onclick="addBlock('h1')">TITRE</button>
        <button onclick="addBlock('h2')">S-TITRE</button>
        <button onclick="addBlock('p')">TEXTE</button>
        <button onclick="addBlock('img')">PHOTOS</button>
        <button class="btn-pdf" onclick="window.print()">GÉNÉRER PDF</button>
    </div>

    <div id="paper">
        </div>

    <script>
        function addBlock(type) {
            const paper = document.getElementById('paper');
            const div = document.createElement('div');
            div.className = 'block';
            div.dataset.type = type;

            let html = `<span class="del-btn" onclick="this.parentElement.remove()">Supprimer</span>`;

            if (type === 'img') {
                html += `<input type="file" multiple accept="image/*" onchange="handleImages(this)">
                         <div class="img-grid"></div>`;
            } else {
                html += `<div class="edit-zone">
                            <textarea style="width:100%;" placeholder="Saisir ${type}..."></textarea>
                            <button class="btn-validate" onclick="validate(this)">OK</button>
                         </div>
                         <div class="view-zone" style="display:none;" onclick="edit(this)"></div>`;
            }

            div.innerHTML = html;
            paper.appendChild(div);
            div.scrollIntoView({ behavior: 'smooth' });
        }

        function validate(btn) {
            const block = btn.parentElement;
            const text = block.querySelector('textarea').value;
            const viewZone = block.nextElementSibling;
            const type = btn.closest('.block').dataset.type;

            // Applique le style selon le type
            const tag = (type === 'h1') ? 'h1' : (type === 'h2') ? 'h2' : 'p';
            viewZone.innerHTML = `<${tag}>${text}</${tag}>`;
            
            block.style.display = 'none';
            viewZone.style.display = 'block';
        }

        function edit(viewZone) {
            viewZone.style.display = 'none';
            viewZone.previousElementSibling.style.display = 'block';
        }

        function handleImages(input) {
            const grid = input.nextElementSibling;
            const files = Array.from(input.files);
            const count = files.length;

            // Logique de grille selon ton souhait
            let cols = 3;
            if (count === 1) cols = 1;
            else if (count === 2 || count === 4) cols = 2;
            
            grid.style.setProperty('--cols', cols);

            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = document.createElement('img');
                    img.src = e.target.result;
                    grid.appendChild(img);
                };
                reader.readAsDataURL(file);
            });
            input.style.display = 'none';
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rapport Étanchéité Pro</title>
    <style>
        :root { --p-width: 210mm; --p-height: 297mm; }
        
        body { background: #333; margin: 0; display: flex; flex-direction: column; align-items: center; font-family: Arial, sans-serif; }
        
        /* BARRE D'OUTILS */
        .toolbar { 
            position: fixed; top: 0; width: 100%; background: #111; padding: 10px; 
            display: flex; justify-content: center; gap: 10px; z-index: 2000; 
        }
        .toolbar button { padding: 10px; border-radius: 5px; border: none; cursor: pointer; font-weight: bold; }
        .btn-pdf { background: #27ae60; color: white; }

        /* PAGES */
        #container { margin-top: 70px; padding-bottom: 50px; }
        .page {
            width: var(--p-width);
            height: 296.8mm; /* Légèrement moins que 297 pour éviter la page blanche */
            background: white;
            margin-bottom: 10px;
            padding: 10mm;
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }

        /* BLOCS */
        .block { 
            margin-bottom: 5mm; 
            position: relative; 
            width: 100%; 
            min-height: 10mm;
        }

        /* MODE ÉDITION : Redimensionnement manuel */
        .edit-active { 
            border: 2px dashed #3498db; 
            overflow: auto; 
            resize: vertical; /* Permet de tirer le coin en bas à droite */
            padding-bottom: 15px;
        }

        h1 { font-size: 20pt; text-transform: uppercase; border-bottom: 2px solid #000; margin: 0 0 4mm 0; }
        h2 { font-size: 14pt; text-transform: uppercase; margin: 0 0 2mm 0; }
        p { font-size: 11pt; margin: 0; white-space: pre-wrap; }

        .img-grid { 
            display: grid; gap: 2mm; width: 100%;
            grid-template-columns: repeat(var(--cols, 1), 1fr);
        }
        .img-grid img { width: 100%; height: 100%; object-fit: cover; display: block; }

        .del-btn { 
            position: absolute; left: -30px; top: 0; color: red; 
            font-weight: bold; cursor: pointer; display: block; 
        }

        /* IMPRESSION SANS PAGES BLANCHES */
        @media print {
            @page { margin: 0; size: A4; }
            .toolbar, .del-btn, .edit-zone, button, input { display: none !important; }
            body { background: white; }
            #container { margin: 0; }
            .page { 
                margin: 0 !important; 
                box-shadow: none !important; 
                page-break-after: always; 
                page-break-inside: avoid;
                height: var(--p-height);
            }
            .block { border: none !important; resize: none !important; }
        }

        /* MOBILE ZOOM */
        @media screen and (max-width: 210mm) {
            #container { transform: scale(calc(100vw / 220mm)); transform-origin: top center; }
        }
    </style>
</head>
<body>

    <div class="toolbar">
        <button onclick="addBlock('h1')">H1</button>
        <button onclick="addBlock('h2')">H2</button>
        <button onclick="addBlock('p')">TEXTE</button>
        <button onclick="addBlock('img')">PHOTOS</button>
        <button class="btn-pdf" onclick="window.print()">ENREGISTRER PDF</button>
    </div>

    <div id="container">
        <div class="page" id="page-1"></div>
    </div>

    <script>
        let activePageId = 1;

        function addBlock(type) {
            // On vérifie toujours si la page précédente peut accueillir le bloc
            findBestPage();
            
            const page = document.getElementById(`page-${activePageId}`);
            const div = document.createElement('div');
            div.className = 'block edit-active'; 
            div.dataset.type = type;

            let html = `<span class="del-btn" onclick="removeBlock(this)">✕</span>`;

            if (type === 'img') {
                html += `<div class="edit-zone"><input type="file" multiple onchange="handleImages(this)"></div><div class="img-grid"></div>`;
            } else {
                html += `<div class="edit-zone">
                            <textarea style="width:100%;" placeholder="Saisir..."></textarea>
                            <button onclick="validate(this)">OK</button>
                         </div>
                         <div class="view" style="display:none;" onclick="edit(this)"></div>`;
            }

            div.innerHTML = html;
            page.appendChild(div);
        }

        function validate(btn) {
            const block = btn.closest('.block');
            const txt = block.querySelector('textarea').value;
            const view = block.querySelector('.view');
            const tag = block.dataset.type === 'h1' ? 'h1' : (block.dataset.type === 'h2' ? 'h2' : 'p');
            
            view.innerHTML = `<${tag}>${txt}</${tag}>`;
            block.querySelector('.edit-zone').style.display = 'none';
            view.style.display = 'block';
            block.classList.remove('edit-active'); // On enlève la poignée de redimensionnement après validation
            checkOverflow();
        }

        function edit(view) {
            const block = view.closest('.block');
            view.style.display = 'none';
            block.querySelector('.edit-zone').style.display = 'block';
            block.classList.add('edit-active'); // On remet la poignée pour ajuster
        }

        function handleImages(input) {
            const grid = input.parentElement.nextElementSibling;
            const block = input.closest('.block');
            const files = Array.from(input.files);
            let cols = files.length === 1 ? 1 : (files.length === 2 || files.length === 4 ? 2 : 3);
            grid.style.setProperty('--cols', cols);

            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = document.createElement('img');
                    img.src = e.target.result;
                    grid.appendChild(img);
                };
                reader.readAsDataURL(file);
            });
            input.parentElement.style.display = 'none';
            block.classList.remove('edit-active');
            setTimeout(checkOverflow, 400);
        }

        function checkOverflow() {
            const page = document.getElementById(`page-${activePageId}`);
            if (page.scrollHeight > page.clientHeight) {
                const lastBlock = page.lastElementChild;
                activePageId++;
                let nextPage = document.getElementById(`page-${activePageId}`);
                
                if (!nextPage) {
                    nextPage = document.createElement('div');
                    nextPage.className = 'page';
                    nextPage.id = `page-${activePageId}`;
                    document.getElementById('container').appendChild(nextPage);
                }
                nextPage.appendChild(lastBlock);
            }
        }

        function findBestPage() {
            // Parcourt les pages depuis la 1 pour voir laquelle est vide ou a de la place
            const pages = document.querySelectorAll('.page');
            for (let i = 0; i < pages.length; i++) {
                if (pages[i].scrollHeight < pages[i].clientHeight - 100) {
                    activePageId = i + 1;
                    return;
                }
            }
        }

        function removeBlock(btn) {
            const block = btn.parentElement;
            block.remove();
            findBestPage(); // Recalcule la page active après suppression
        }
    </script>
</body>
</html>
